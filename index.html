<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalizeSMP — Официальный сайт</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0093E9 0%, #80D0C7 50%, #0000FF 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .block-card {
            background-color: #000000;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .ip-title {
            color: #0093E9;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .ip-address {
            color: #ffffff;
            font-size: 1.8rem;
            font-family: monospace;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .ip-address:hover {
            transform: scale(1.03);
        }

        .open-modal-btn {
            width: 100%;
            padding: 20px;
            background-color: #000000;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }

        .open-modal-btn:hover {
            border-color: #0093E9;
            color: #0093E9;
            transform: scale(1.02);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-window {
            background-color: #000000;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            padding: 30px;
            border: 2px solid #0093E9;
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-window {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #111;
            color: #fff;
            font-size: 1rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #0093E9;
        }

        textarea.input-field {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0093E9, #0000FF);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>VitalizeSMP</h1>

        <div class="block-card">
            <div class="ip-title">Айпи сервера:</div>
            <div class="ip-address" onclick="navigator.clipboard.writeText('65.21.16.190:25854'); alert('IP скопирован!');">
                65.21.16.190:25854
            </div>
        </div>

        <button class="open-modal-btn" onclick="toggleModal(true)">Подать заявку</button>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-window">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            <div class="modal-title">Анкета игрока</div>
            
            <form id="applicationForm" onsubmit="sendToDiscord(event)">
                <input type="text" id="nickname" class="input-field" placeholder="Ваш ник в Minecraft" required>
                <input type="number" id="age" class="input-field" placeholder="Ваш возраст" required>
                <textarea id="about" class="input-field" placeholder="Расскажите о себе и почему хотите к нам?" required></textarea>
                <button type="submit" class="submit-btn" id="subBtn">Отправить заявку</button>
            </form>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const overlay = document.getElementById('modalOverlay');
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        function closeModalOnOverlay(event) {
            const overlay = document.getElementById('modalOverlay');
            if (event.target === overlay) {
                toggleModal(false);
            }
        }

        // Логика отправки заявки в Discord
        function sendToDiscord(event) {
            event.preventDefault();
            
            const btn = document.getElementById('subBtn');
            btn.disabled = true;
            btn.innerText = 'Отправка...';

            const nickname = document.getElementById('nickname').value;
            const age = document.getElementById('age').value;
            const about = document.getElementById('about').value;

            // СЮДА ВСТАВИТЬ ССЫЛКУ ИЗ ДИСКОРДА (Внутри кавычек)
            const webhookUrl = "https://discord.com/api/webhooks/1533404314003964004/i8Yvk4xWGn5SN1wJk8pyzt7DmcQhrs6pU1Zkdzxq-VbC9j59YRC4s3hXkmV2oJcLDqDM";

            const requestBody = {
                username: "VitalizeSMP Заявки",
                embeds: [{
                    title: "Новая заявка на сервер!",
                    color: 37769, 
                    fields: [
                        { name: "Ник в игре:", value: nickname, inline: true },
                        { name: "Возраст:", value: age, inline: true },
                        { name: "О себе / Почему мы:", value: about }
                    ],
                    footer: { text: "Форма на сайте vitalizesmp.ru" },
                    timestamp: new Date()
                }]
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            })
            .then(() => {
                alert('Заявка успешно отправлена в Discord!');
                document.getElementById('applicationForm').reset();
                toggleModal(false);
            })
            .catch(err => {
                alert('Ошибка при отправке. Проверьте ссылку вебхука.');
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = 'Отправить заявку';
            });
        }
    </script>

</body>
</html>
