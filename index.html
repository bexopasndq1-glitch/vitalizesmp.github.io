<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalizeSMP — Официальный сайт</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0093E9 0%, #80D0C7 50%, #0000FF 100%);
            background-attachment: fixed; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; color: white; padding: 20px;
        }
        .container { width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 3.5rem; color: #ffffff; text-shadow: 3px 3px 0px #000; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .block-card {
            background-color: #000000; border-radius: 15px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .ip-title { color: #0093E9; font-size: 1.2rem; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
        .ip-address { color: #ffffff; font-size: 1.8rem; font-family: monospace; cursor: pointer; }
        .btn-group { display: flex; gap: 15px; margin-bottom: 25px; }
        .open-modal-btn {
            flex: 1; padding: 18px; background-color: #000; color: #fff; font-size: 1.1rem;
            font-weight: bold; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 15px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: all 0.2s;
        }
        .open-modal-btn:hover { border-color: #0093E9; color: #0093E9; transform: scale(1.02); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-window { background-color: #000; width: 100%; max-width: 450px; border-radius: 15px; padding: 30px; border: 2px solid #0093E9; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #888; font-size: 1.8rem; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #333; border-radius: 8px; background-color: #111; color: #fff; font-size: 1rem; }
        .input-field:focus { border-color: #0093E9; outline: none; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #0093E9, #0000FF); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .status-result { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; text-align: center; }
        .status-waiting { background-color: #332200; color: #ffcc00; }
        .status-accepted { background-color: #003311; color: #00ff66; }
        .status-rejected { background-color: #330000; color: #ff3333; }
    </style>
</head>
<body>

    <div class="container">
        <h1>VitalizeSMP</h1>

        <div class="block-card">
            <div class="ip-title">Айпи сервера:</div>
            <div class="ip-address" onclick="navigator.clipboard.writeText('vitalizesmp.ru'); alert('IP скопирован!');">vitalizesmp.ru</div>
        </div>

        <div class="btn-group">
            <button class="open-modal-btn" onclick="toggleModal('regModal', true)">Подать заявку</button>
            <button class="open-modal-btn" onclick="toggleModal('statusModal', true)">Статус заявки</button>
        </div>
    </div>

    <!-- МОДАЛКА ЗАЯВКИ -->
    <div class="modal-overlay" id="regModal" onclick="closeModalOnOverlay(event, 'regModal')">
        <div class="modal-window">
            <button class="close-btn" onclick="toggleModal('regModal', false)">&times;</button>
            <div style="font-size:1.6rem; margin-bottom:20px; text-align:center; font-weight:bold;">Подача заявки</div>
            <form id="regForm" onsubmit="registerPlayer(event)">
                <input type="text" id="regNick" class="input-field" placeholder="Ваш ник в Minecraft" required>
                <input type="number" id="regAge" class="input-field" placeholder="Ваш возраст" required>
                <textarea id="regAbout" class="input-field" style="resize:vertical; min-height:90px;" placeholder="Расскажите о себе и почему хотите к нам?" required></textarea>
                <button type="submit" class="submit-btn" id="subBtnReg">Отправить анкету</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛКА СТАТУСА -->
    <div class="modal-overlay" id="statusModal" onclick="closeModalOnOverlay(event, 'statusModal')">
        <div class="modal-window">
            <button class="close-btn" onclick="toggleModal('statusModal', false)">&times;</button>
            <div style="font-size:1.6rem; margin-bottom:20px; text-align:center; font-weight:bold;">Проверить статус</div>
            <form id="statusForm" onsubmit="checkStatus(event)">
                <input type="text" id="checkNick" class="input-field" placeholder="Введите ваш ник в Minecraft" required>
                <button type="submit" class="submit-btn" id="subBtnStatus">Проверить</button>
            </form>
            <div id="statusOutput" class="status-result"></div>
        </div>
    </div>

    <script>
        // ЗАМЕНИТЕ АДРЕС НИЖЕ НА ВАШУ ССЫЛКУ ИЗ RENDER (когда запустите проект на Render)
        // Прокси "cors-anywhere" в начале строки помогает стабильно отправлять запросы из РФ
        const BACKEND_URL = "https://herokuapp.com";

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        function closeModalOnOverlay(e, id) {
            if (e.target === document.getElementById(id)) toggleModal(id, false);
        }

        function registerPlayer(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtnReg');
            btn.disabled = true; btn.innerText = 'Отправка...';

            fetch(`${BACKEND_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nickname: document.getElementById('regNick').value,
                    age: document.getElementById('regAge').value,
                    about: document.getElementById('regAbout').value
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.success) { document.getElementById('regForm').reset(); toggleModal('regModal', false); }
            })
            .catch(() => alert('Ошибка отправки. Попробуйте еще раз через минуту.'))
            .finally(() => { btn.disabled = false; btn.innerText = 'Отправить анкету'; });
        }

        function checkStatus(e) {
            e.preventDefault();
            const output = document.getElementById('statusOutput');
            output.style.display = 'none';

            fetch(`${BACKEND_URL}/api/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nickname: document.getElementById('checkNick').value
                })
            })
            .then(res => res.json())
            .then(data => {
                output.style.display = 'block';
                output.className = 'status-result';
                
                if (!data.success) {
                    output.innerText = data.message;
                    output.classList.add('status-rejected');
                } else {
                    if (data.status === 'ожидание') {
                        output.innerText = 'Статус: Ожидание рассмотрения ⏳';
                        output.classList.add('status-waiting');
                    } else if (data.status === 'Отказано') {
                        output.innerText = 'Статус: Отказано ❌';
                        output.classList.add('status-rejected');
                    } else if (data.status === 'Принят') {
                        output.innerText = 'Статус: Принят! Ты внесен в белый список. 🎉';
                        output.classList.add('status-accepted');
                    }
                }
            })
            .catch(() => alert('Ошибка запроса статуса.'));
        }
    </script>
</body>
</html>
