<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalizeSMP — Официальный сайт</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0093E9 0%, #80D0C7 50%, #0000FF 100%);
            background-attachment: fixed; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; color: white; padding: 20px;
        }
        .container { width: 100%; max-width: 500px; text-align: center; display: flex; flex-direction: column; }
        h1 { font-size: 3.5rem; color: #ffffff; text-shadow: 3px 3px 0px #000; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .block-card {
            background-color: #000000; border-radius: 15px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .ip-title { color: #0093E9; font-size: 1.2rem; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
        .ip-address { color: #ffffff; font-size: 1.8rem; font-family: monospace; cursor: pointer; word-break: break-all; }
        .btn-group { display: flex; gap: 15px; margin-bottom: 15px; width: 100%; }
        .open-modal-btn {
            flex: 1; padding: 18px; background-color: #000; color: #fff; font-size: 1.1rem;
            font-weight: bold; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 15px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: all 0.2s;
        }
        .open-modal-btn:hover { border-color: #0093E9; color: #0093E9; transform: scale(1.02); }
        .social-btn {
            display: block; width: 100%; padding: 18px; color: #ffffff; font-size: 1.1rem; font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 15px; cursor: pointer; text-decoration: none;
            margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: all 0.2s ease; text-align: center;
        }
        .social-btn span { font-size: 0.9rem; font-weight: normal; opacity: 0.8; margin-left: 5px; display: inline-block; }
        .btn-discord { background-color: #5865F2; }
        .btn-discord:hover { background-color: #4752C4; transform: scale(1.02); }
        .btn-telegram { background-color: #24A1DE; margin-bottom: 25px; }
        .btn-telegram:hover { background-color: #1D84B9; transform: scale(1.02); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 15px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-window { background-color: #000; width: 100%; max-width: 450px; border-radius: 15px; padding: 30px; border: 2px solid #0093E9; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #888; font-size: 1.8rem; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #333; border-radius: 8px; background-color: #111; color: #fff; font-size: 1rem; }
        .input-field:focus { border-color: #0093E9; outline: none; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #0093E9, #0000FF); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        @media (max-width: 400px) { h1 { font-size: 2.5rem; } .social-btn span { display: block; margin-left: 0; margin-top: 4px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>VitalizeSMP</h1>
        <div class="block-card">
            <div class="ip-title">Айпи сервера:</div>
            <div class="ip-address" onclick="navigator.clipboard.writeText('vitalizesmp.ru'); alert('IP скопирован!');">vitalizesmp.ru</div>
        </div>
        <div class="btn-group">
            <button class="open-modal-btn" onclick="toggleModal('regModal', true)">Подать заявку</button>
        </div>
        <a href="https://discord.gg" target="_blank" class="social-btn btn-discord">
            Наш Discord <span>(просматривать заявки там)</span>
        </a>
        <a href="https://t.me" target="_blank" class="social-btn btn-telegram">Наш Telegram</a>
    </div>

    <div class="modal-overlay" id="regModal" onclick="closeModalOnOverlay(event, 'regModal')">
        <div class="modal-window">
            <button class="close-btn" onclick="toggleModal('regModal', false)">&times;</button>
            <div style="font-size:1.6rem; margin-bottom:20px; text-align:center; font-weight:bold;">Подача заявки</div>
            <form id="regForm" onsubmit="sendApplication(event)">
                <input type="text" id="regNick" class="input-field" placeholder="Ваш ник в Minecraft" required>
                <input type="number" id="regAge" class="input-field" placeholder="Ваш возраст" required>
                <!-- Необязательное поле для Discord -->
                <input type="text" id="regDiscord" class="input-field" placeholder="Ваш Discord ник (желательно)">
                <textarea id="regAbout" class="input-field" style="resize:vertical; min-height:90px;" placeholder="Расскажите о себе и почему хотите к нам?" required></textarea>
                <button type="submit" class="submit-btn" id="subBtnReg">Отправить анкету</button>
            </form>
        </div>
    </div>

    <script>
        // Не забудьте вставить сюда две половинки вашей ссылки вебхука из Дискорда
        const PART1 = "https://discord.com";
        const PART2 = "api/webhooks/1533404314003964004/i8Yvk4xWGn5SN1wJk8pyzt7DmcQhrs6pU1Zkdzxq-VbC9j59YRC4s3hXkmV2oJcLDqDM";

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }
        function closeModalOnOverlay(e, id) { if (e.target === document.getElementById(id)) toggleModal(id, false); }
        function sendApplication(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtnReg');
            btn.disabled = true; btn.innerText = 'Отправка...';
            
            const nick = document.getElementById('regNick').value;
            const age = document.getElementById('regAge').value;
            const discordVal = document.getElementById('regDiscord').value.trim();
            const about = document.getElementById('regAbout').value;

            // Если дискорд не ввели, пишем "Не указан"
            const discordUser = discordVal ? discordVal : "Не указан";

            fetch(PART1 + PART2, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: "VitalizeSMP Заявки",
                    embeds: [{
                        title: "📝 Новая заявка на сервер!", color: 37769,
                        fields: [
                            { name: "Ник в игре:", value: nick, inline: true },
                            { name: "Возраст:", value: age, inline: true },
                            { name: "Discord аккаунт:", value: discordUser, inline: true },
                            { name: "О себе / Почему мы:", value: about }
                        ],
                        timestamp: new Date()
                    }]
                })
            })
            .then(() => {
                alert('Заявка успешно отправлена! Администрация рассмотрит её в ближайшее время.');
                document.getElementById('regForm').reset();
                toggleModal('regModal', false);
            })
            .catch(() => alert('Ошибка отправки. Проверьте правильность частей вебхука в коде.'))
            .finally(() => { btn.disabled = false; btn.innerText = 'Отправить анкету'; });
        }
    </script>
</body>
</html>
